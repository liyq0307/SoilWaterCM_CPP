global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'soilwatercm-monitor'

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'soilwatercm-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'soilwatercm-backend'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongo-exporter:9216']

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
