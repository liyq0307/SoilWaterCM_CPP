server:
  host: "0.0.0.0"
  port: 8080
  workers: 4
  max_connections: 1000
  keep_alive_timeout: 60

jwt:
  secret: "${JWT_SECRET}"
  expiration: 604800
  issuer: "soilwatercm"

logging:
  level: "INFO"
  format: "json"
  file: "logs/soilwatercm.log"
  max_size: 10485760
  max_files: 30
  console: true

storage:
  base_dir: "data"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  results_dir: "data/results"
  temp_dir: "data/temp"
  max_file_size: 2147483648

processing:
  max_concurrent_tasks: 10
  task_timeout: 3600
  retry_attempts: 2
  retry_delay: 5

qgis:
  server_url: "http://localhost:8081"
  projects_dir: "qgis/projects"
  styles_dir: "qgis/styles"

external_tools:
  grass:
    enabled: true
    use_qgis_processing: true
  saga:
    enabled: true
    use_qgis_processing: true
  otb:
    enabled: true
    home: "${OTB_HOME}"
  isce2:
    enabled: true
    conda_env: "isce2"
  snap:
    enabled: true
    gpt_path: "${SNAP_HOME}/bin/gpt.exe"
  mintpy:
    enabled: true
    conda_env: "mintpy"

monitoring:
  prometheus:
    enabled: true
    port: 9090
  health_check:
    enabled: true
    path: "/health"
