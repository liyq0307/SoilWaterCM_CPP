loggers:
  - name: "soilwatercm"
    level: "INFO"
    sinks:
      - type: "console"
        format: "json"
        level: "INFO"
      - type: "file"
        format: "json"
        level: "INFO"
        filename: "logs/soilwatercm.log"
        max_size: 10485760
        max_files: 30
        rotate_on_open: true

  - name: "soilwatercm.http"
    level: "INFO"
    sinks:
      - type: "file"
        format: "json"
        level: "INFO"
        filename: "logs/http.log"
        max_size: 10485760
        max_files: 7

  - name: "soilwatercm.processing"
    level: "DEBUG"
    sinks:
      - type: "file"
        format: "json"
        level: "DEBUG"
        filename: "logs/processing.log"
        max_size: 52428800
        max_files: 10

  - name: "soilwatercm.database"
    level: "WARNING"
    sinks:
      - type: "file"
        format: "json"
        level: "WARNING"
        filename: "logs/database.log"
        max_size: 10485760
        max_files: 7

  - name: "soilwatercm.external"
    level: "INFO"
    sinks:
      - type: "file"
        format: "json"
        level: "INFO"
        filename: "logs/external_tools.log"
        max_size: 10485760
        max_files: 14

format:
  json:
    pattern: '{"timestamp":"%Y-%m-%d %H:%M:%S.%f","level":"%l","logger":"%n","message":"%v","thread_id":"%t","trace_id":"%x"}'
  text:
    pattern: "[%Y-%m-%d %H:%M:%S.%f] [%l] [%n] [%t] [%x] %v"

flush:
  level: "WARNING"
  interval: 1

async:
  enabled: true
  queue_size: 8192
  thread_count: 2
