postgresql:
  host: "${POSTGRES_HOST}"
  port: 5432
  database: "soilwatercm"
  user: "${POSTGRES_USER}"
  password: "${POSTGRES_PASSWORD}"
  
  connection_pool:
    min_connections: 5
    max_connections: 20
    connection_timeout: 30
    idle_timeout: 600
  
  ssl:
    enabled: false
    cert_file: ""
    key_file: ""
    ca_file: ""

mongodb:
  host: "${MONGO_HOST}"
  port: 27017
  database: "soilwatercm_meta"
  user: "${MONGO_USER}"
  password: "${MONGO_PASSWORD}"
  
  connection_pool:
    min_connections: 3
    max_connections: 10
    connection_timeout: 30
    max_idle_time: 60000
  
  auth_source: "admin"
  replica_set: ""

redis:
  host: "${REDIS_HOST}"
  port: 6379
  password: "${REDIS_PASSWORD}"
  database: 0
  
  connection_pool:
    max_connections: 20
    connection_timeout: 5
    socket_timeout: 3
  
  retry:
    max_attempts: 3
    retry_delay: 1
